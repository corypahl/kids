name: "Build/Deploy: Kids Christmas"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/christmas/**'
      - 'services/gateway/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-christmas.yml'
  pull_request:
    paths:
      - 'apps/christmas/**'
      - 'services/gateway/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-christmas.yml'

permissions:
  contents: read

concurrency:
  group: build-christmas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Christmas app
        run: npm run lint --workspace kids-christmas

      - name: Test Christmas worker
        run: npm test --workspace kids-christmas

      - name: Build Christmas app
        run: npm run build --workspace kids-christmas

      - name: Configure Christmas D1 and R2 bindings
        if: github.event_name != 'pull_request'
        env:
          CHRISTMAS_D1_DATABASE_ID: ${{ secrets.KIDS_CHRISTMAS_D1_DATABASE_ID }}
          CHRISTMAS_ACCESS_TEAM_DOMAIN: ${{ secrets.KIDS_CHRISTMAS_ACCESS_TEAM_DOMAIN }}
          CHRISTMAS_ACCESS_AUD: ${{ secrets.KIDS_CHRISTMAS_ACCESS_AUD }}
        run: |
          if [ -z "$CHRISTMAS_D1_DATABASE_ID" ]; then
            echo "::error::Add repository secret KIDS_CHRISTMAS_D1_DATABASE_ID after creating the D1 database"
            exit 1
          fi
          if [ -z "$CHRISTMAS_ACCESS_TEAM_DOMAIN" ] || [ -z "$CHRISTMAS_ACCESS_AUD" ]; then
            echo "::error::Configure KIDS_CHRISTMAS_ACCESS_TEAM_DOMAIN and KIDS_CHRISTMAS_ACCESS_AUD repository secrets for Cloudflare Access"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'apps/christmas/wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases = [{
            binding: 'DB',
            database_name: 'kids-christmas',
            database_id: process.env.CHRISTMAS_D1_DATABASE_ID,
            migrations_dir: 'migrations'
          }];
          config.r2_buckets = [{ binding: 'MEDIA', bucket_name: 'kids-christmas-media' }];
          config.vars = {
            ...config.vars,
            CHRISTMAS_ACCESS_TEAM_DOMAIN: process.env.CHRISTMAS_ACCESS_TEAM_DOMAIN,
            CHRISTMAS_ACCESS_AUD: process.env.CHRISTMAS_ACCESS_AUD
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          NODE

      - name: Apply Christmas D1 migrations
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kids-christmas --remote --config apps/christmas/wrangler.jsonc

      - name: Deploy kids-christmas Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/christmas/wrangler.jsonc

      - name: Deploy kids-gateway after Christmas Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config services/gateway/wrangler.jsonc
