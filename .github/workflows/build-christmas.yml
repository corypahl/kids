name: "Build/Deploy: Kids Christmas"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/christmas/**'
      - 'services/gateway/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-christmas.yml'
  pull_request:
    paths:
      - 'apps/christmas/**'
      - 'services/gateway/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-christmas.yml'

permissions:
  contents: read

concurrency:
  group: build-christmas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Christmas app
        run: npm run lint --workspace kids-christmas

      - name: Test Christmas worker
        run: npm test --workspace kids-christmas

      - name: Test Christmas gateway routing
        run: node --test services/gateway/test/index.test.mjs

      - name: Build Christmas app
        run: npm run build --workspace kids-christmas

      - name: Configure Christmas D1 and R2 bindings
        if: github.event_name != 'pull_request'
        env:
          CHRISTMAS_D1_DATABASE_ID: ${{ secrets.KIDS_CHRISTMAS_D1_DATABASE_ID }}
          PARENT_ACCESS_TEAM_DOMAIN: ${{ vars.KIDS_PARENT_ACCESS_TEAM_DOMAIN }}
          PARENT_ACCESS_AUD: ${{ vars.KIDS_PARENT_ACCESS_AUD }}
          PARENT_ALLOWED_EMAILS: ${{ vars.KIDS_PARENT_ALLOWED_EMAILS }}
        run: |
          if [ -z "$CHRISTMAS_D1_DATABASE_ID" ]; then
            echo "::error::Add repository secret KIDS_CHRISTMAS_D1_DATABASE_ID after creating the D1 database"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'apps/christmas/wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases = [{
            binding: 'DB',
            database_name: 'kids-christmas',
            database_id: process.env.CHRISTMAS_D1_DATABASE_ID,
            migrations_dir: 'migrations'
          }];
          config.r2_buckets = [{ binding: 'MEDIA', bucket_name: 'kids-christmas-media' }];
          // Do not deploy a keyless parent dashboard. Cloudflare Access must be
          // configured on BOTH parent HTML and API paths before enabling this.
          const domain = (process.env.PARENT_ACCESS_TEAM_DOMAIN || '').trim();
          const audience = (process.env.PARENT_ACCESS_AUD || '').trim();
          const emails = (process.env.PARENT_ALLOWED_EMAILS || '').trim();
          if (!/^[a-z0-9-]+\\.cloudflareaccess\\.com$/.test(domain) || !audience ||
              !emails.includes('@')) {
            throw new Error('Set KIDS_PARENT_ACCESS_TEAM_DOMAIN, KIDS_PARENT_ACCESS_AUD, and KIDS_PARENT_ALLOWED_EMAILS repository variables after configuring Cloudflare Access.');
          }
          config.vars = {
            ...(config.vars || {}),
            CHRISTMAS_PARENT_ACCESS_TEAM_DOMAIN: domain,
            CHRISTMAS_PARENT_ACCESS_AUD: audience,
            CHRISTMAS_PARENT_ALLOWED_EMAILS: emails,
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          NODE

      - name: Apply Christmas D1 migrations
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kids-christmas --remote --config apps/christmas/wrangler.jsonc

      - name: Deploy kids-christmas Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/christmas/wrangler.jsonc

      - name: Deploy kids-gateway after Christmas Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config services/gateway/wrangler.jsonc
